shorten_home_path = true

# All = open sessions + projects + zoxide, deduped by path; hidden unless listed.
source_order = ["All", "Sessions", "Agents", "Projects", "My Projects", "Public", "Recent", "Find"]
initial_source = "All"

# No [default_session] startup_command: it would also run in every ad-hoc
# zoxide/find session.

[[sources]]
name = "My Projects"
type = "command"
cwd = "~/Development/Projects"
command = ["fd", "-t", "d", "-d", "1", ".", "."]
format = "paths"
timeout = 5

[[sources]]
name = "Public"
type = "command"
cwd = "~/Development/PublicRepos"
command = ["fd", "-t", "d", "-d", "1", ".", "."]
format = "paths"
timeout = 5

# --- Single-pane projects ---

[[session]]
name = "dotfiles"
path = "~/.local/share/chezmoi"

[[session]]
name = "homelab"
